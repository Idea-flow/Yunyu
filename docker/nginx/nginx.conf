# Nginx 反向代理配置
# 适用场景：纯 Docker 管理，nginx 作为唯一对外入口
# 前端 (yunyu-web:3000) 和后端 (yunyu-server-native:20000) 均不对外暴露端口
# 所有流量经由 nginx 的 80 端口进入，由 location 规则分发

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # 开启 gzip 压缩，减少传输体积
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # 上传文件大小限制
    client_max_body_size 50m;

    server {
        listen 80;
        # 本地测试时 server_name 填 localhost；生产环境替换为实际域名
        server_name ${NGINX_SERVER_NAME:-localhost};

        # /api/web/* 由 Nuxt SSR 处理，不转发给后端
        location /api/web/ {
            proxy_pass http://yunyu-web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /api/* 转发给后端 Spring Boot
        location /api/ {
            proxy_pass http://yunyu-server-native:20000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # /actuator/* 转发给后端（健康检查等运维接口，生产环境建议关闭或加权限）
        location /actuator/ {
            proxy_pass http://yunyu-server-native:20000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 其余所有请求转发给前端 Nuxt SSR
        location / {
            proxy_pass http://yunyu-web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 支持 WebSocket（Nuxt dev HMR / SSE 等）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
