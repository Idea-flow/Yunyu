# 全局启动文件：纯 Docker 管理模式
# 架构：nginx（80 对外）→ yunyu-web（3000）/ yunyu-server-native（20000）→ yunyu-mysql（3306）
# web 和 server 容器不对外暴露端口，所有流量经 nginx 统一入口分发
# 执行方式：cd Yunyu && docker compose -f docker/docker-compose.yml up -d

services:
  yunyu-mysql:
    image: mysql:8.4
    container_name: yunyu-mysql
    restart: unless-stopped
    environment:
      # 不预建业务库，由 Spring Boot 启动时自动创建库和表
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - ../yunyu_mysql_data:/var/lib/mysql
    networks:
      - yunyu-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  yunyu-server-native:
    image: ${YUNYU_SERVER_NATIVE_IMAGE:-ghcr.io/idea-flow/yunyu-server-native:latest}
    container_name: yunyu-server-native
    restart: unless-stopped
    depends_on:
      yunyu-mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod,native}
      # 使用 root 连接，确保 Spring Boot 有权限自动建库建表
      SPRING_DATASOURCE_URL: jdbc:mysql://yunyu-mysql:3306/${MYSQL_DATABASE:-yunyu}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      YUNYU_JWT_SECRET: ${YUNYU_JWT_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      TZ: ${TZ:-Asia/Shanghai}
    # 不对外暴露端口，只在内部网络中被 nginx 访问
    networks:
      - yunyu-network

  yunyu-web:
    image: ${YUNYU_WEB_IMAGE:-ghcr.io/idea-flow/yunyu-web:latest}
    container_name: yunyu-web
    restart: unless-stopped
    depends_on:
      - yunyu-server-native
    environment:
      # SSR 服务端调用后端使用容器名（内部网络），浏览器端 API 请求经 nginx 同域转发，无需单独配置
      YUNYU_API_BASE_INTERNAL: ${YUNYU_API_BASE_INTERNAL:-http://yunyu-server-native:20000}
      NUXT_PUBLIC_API_BASE: ${YUNYU_PUBLIC_API_BASE:-}
      TZ: ${TZ:-Asia/Shanghai}
    # 不对外暴露端口，只在内部网络中被 nginx 访问
    networks:
      - yunyu-network

  yunyu-nginx:
    image: nginx:alpine
    container_name: yunyu-nginx
    restart: unless-stopped
    depends_on:
      - yunyu-web
      - yunyu-server-native
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - yunyu-network

networks:
  yunyu-network:
    name: yunyu-network
